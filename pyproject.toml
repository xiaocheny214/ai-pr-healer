[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "healpr"
version = "0.1.0"
description = "MCP-powered AI PR Reviewer with autonomous bug reproduction, issue creation, and self-healing workflow."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "xiaocheny214", email = "187097481+xiaocheny214@users.noreply.github.com" },
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/healpr"]
